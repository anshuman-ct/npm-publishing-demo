
name: Download npm Artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID"
        required: true
        type: string

permissions:
  actions: read

jobs:
  download:
    name: Download and Verify Package
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: downloaded-artifacts

      - name: Inspect downloaded artifact
        run: |
          echo "Downloaded files:"
          find downloaded-artifacts -type f

      - name: Verify npm package
        run: |
          PACKAGE=$(find downloaded-artifacts -name "*.tgz" -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "No npm package found!"
            exit 1
          fi

          echo "Package found: $PACKAGE"
          tar -tzf "$PACKAGE"
